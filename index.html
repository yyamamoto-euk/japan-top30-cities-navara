<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>人口上位30都市　明治から令和まで（1886〜2025）</title>
  <script type="module" src="./src/main.ts"></script>
  <style>
    /* 人口ラベル（src/labels.ts）。文字の大きさは constants.ts の LABEL_FONT_SIZE */
    .pillar-labels {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .pillar-label {
      position: absolute;
      left: 0;
      top: 0;
    }
    .pillar-label > span {
      display: block;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.85);
      color: #1b2a44;
      font: 600 var(--label-font-size, 14px) / 1.2 system-ui, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    /* ラベルの中身（src/labels.ts の renderLabel）：1行目「人口 当時の名前」、2行目「（今の名前）」 */
    .pillar-label > span {
      text-align: center;
    }
    .pillar-label__name {
      margin-left: 0.3em;
      font-size: calc(1em * var(--label-name-scale, 0.8));
      font-weight: 500;
    }
    .pillar-label__now {
      display: block;
      font-size: calc(1em * var(--label-now-scale, 0.7));
      font-weight: 400;
      color: #4b5563;
    }
    /* 柱の頭：文字の下端を頭の少し上に置く */
    .pillar-labels--top .pillar-label > span {
      transform: translate(-50%, calc(-100% - 4px));
    }
    /* 根元：文字の上端を根元の少し下に置く */
    .pillar-labels--bottom .pillar-label > span {
      transform: translate(-50%, 4px);
    }

    /* 画面下の中央の操作ボタン（src/controls.ts） */
    .controls {
      position: absolute;
      left: 50%;
      /* 左下のクレジットの上に置く。--credit-h はクレジットの実際の高さ（src/credits.ts が測って入れる。折り返しても重ならないように） */
      bottom: calc(var(--credit-bottom) + var(--credit-h) + 6px);
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
      font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
      color: #1b2a44;
      max-width: calc(100vw - 32px);
      box-sizing: border-box;
    }
    .controls button {
      font: inherit;
      font-weight: 600;
      border: 1px solid #c5cedb;
      border-radius: 8px;
      background: #fff;
      color: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .controls button:hover:not(:disabled) {
      background: #eef3fb;
    }
    .controls button:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .controls__step {
      font-size: 18px;
      padding: 8px 16px;
    }
    .controls__current {
      min-width: 160px;
      text-align: center;
    }
    .controls__title {
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .controls__total {
      margin-left: 12px;
      font-size: 15px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    /* 上位30の入れ替わりの説明（src/controls.ts）。見本の四角の色は constants.ts の CHANGE_* と柱の色に合わせる */
    .controls__changes {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 3px;
      font-size: 12px;
      color: #1b2a44;
    }
    .controls__change {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .controls__swatch {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      box-sizing: border-box;
    }
    .controls__swatch--in {
      background: #f08a00;
      box-shadow: 0 0 3px 1px #ffa000;
    }
    .controls__swatch--out {
      background: rgba(194, 48, 122, 0.55); /* constants.ts の CHANGE_OUT_PILLAR_COLOR・CHANGE_OUT_OPACITY */
    }
    .controls__source {
      font-size: 11px;
      margin-top: 2px;
      color: #4b5563;
      max-width: 520px;
      margin-left: auto;
      margin-right: auto;
    }
    .controls__anim {
      font-size: 13px;
      padding: 6px 10px;
    }
    .controls__anim[aria-pressed="false"] {
      color: #6b7686;
    }

    /* 画面の左の年表（src/timeline.ts）。年の位置（top）は JS で決める */
    .timeline {
      position: absolute;
      left: 16px;
      top: 16px;
      bottom: calc(var(--credit-bottom) + var(--credit-h) + 19px);
      width: 250px;
      padding: 16px 12px 16px 14px;
      box-sizing: border-box;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
      color: #1b2a44;
    }
    .timeline {
      display: flex;
      flex-direction: column;
    }
    .timeline__caption {
      margin: -4px 0 10px;
      font-size: 11px;
      color: #6b7686;
      text-align: right;
    }
    .timeline__list {
      position: relative;
      flex: 1;
      min-height: 0;
    }
    /* 縦の線 */
    .timeline__list::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 8px;
      bottom: 30px;
      width: 2px;
      background: #c5cedb;
    }
    .timeline__item {
      position: absolute;
      left: 0;
      right: 0;
      display: block;
      padding: 0 0 0 22px;
      border: 0;
      background: none;
      color: #4b5563;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    /* 線の上の丸 */
    .timeline__item::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 6px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #9aa7b8;
      box-sizing: border-box;
    }
    .timeline__item:hover .timeline__year {
      text-decoration: underline;
    }
    .timeline__head {
      display: flex;
      align-items: baseline;
      white-space: nowrap;
    }
    .timeline__total {
      margin-left: auto;
      padding-left: 6px;
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .timeline__year {
      font-size: 17px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .timeline__era {
      margin-left: 6px;
      font-size: 12px;
    }
    .timeline__event {
      display: block;
      font-size: 12px;
      line-height: 1.3;
      /* 出来事の文字の中の改行（
）で折り返す（frames.ts の event。1945年） */
      white-space: pre-line;
    }
    .timeline__item--active {
      color: #1b2a44;
    }
    .timeline__item--active .timeline__year {
      font-size: 20px;
    }
    /* 今の年の丸：柱と同じ青 */
    .timeline__item--active::before {
      left: 0;
      top: 6px;
      width: 14px;
      height: 14px;
      border: 0;
      background: #2f6fd6;
    }

    /* 左下に常に出すクレジット（src/credits.ts）。下端からの距離と、1行のときの高さ（実際の高さは credits.ts が --credit-h に入れ直す） */
    :root {
      --credit-bottom: 4px;
      --credit-h: 17px;
    }
    .credit-line {
      position: absolute;
      left: 8px;
      bottom: var(--credit-bottom);
      max-width: calc(100vw - 64px);
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.8);
      color: #374151;
      font: 11px / 1.4 system-ui, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    }
    .credit-line a {
      color: inherit;
    }

    /* ?ui=0（スクリーンショット用）：年表・下のパネル・左下のクレジット・ⓘ を隠す。柱とラベルは出す（src/main.ts） */
    .ui-hidden .intro,
    .ui-hidden .intro-help,
    .ui-hidden .rank-toggle,
    .ui-hidden .rank-panel,
    .ui-hidden .timeline,
    .ui-hidden .controls,
    .ui-hidden .credit-line,
    .ui-hidden .dummy-badge,
    .ui-hidden .navara-attr-dock,
    .ui-hidden .navara-attr-logoframe {
      display: none !important;
    }

    /* 読み上げソフトだけが読む文 */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* 画面の右の一覧（src/rankList.ts）。最初は閉じている */
    .rank-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 6;
      padding: 8px 16px;
      border: 1px solid #c9d3e3;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      font: 600 15px system-ui, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
      color: #1b2a44;
      cursor: pointer;
    }
    .rank-toggle--open {
      background: #1b2a44;
      color: #fff;
    }
    .rank-toggle:focus-visible,
    .rank-panel button:focus-visible,
    .rank-panel a:focus-visible {
      outline: 3px solid #2f6fd6;
      outline-offset: 2px;
    }
    .rank-panel {
      position: absolute;
      top: 64px;
      right: 16px;
      bottom: calc(var(--credit-bottom) + var(--credit-h) + 19px);
      z-index: 5;
      width: 400px;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
      font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
      color: #1b2a44;
    }
    .rank-panel[hidden] {
      display: none;
    }
    .rank-panel__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px 8px;
      border-bottom: 1px solid #e3e8f0;
    }
    .rank-panel__title {
      margin: 0;
      font-size: 16px;
    }
    .rank-panel__title:focus {
      outline: none;
    }
    .rank-panel__close {
      border: none;
      background: none;
      font-size: 22px;
      line-height: 1;
      color: #4a5568;
      cursor: pointer;
      padding: 2px 6px;
    }
    .rank-panel__tools {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px 4px;
      font-size: 11px;
      color: #6b7686;
    }
    .rank-panel__home {
      padding: 4px 10px;
      border: 1px solid #c9d3e3;
      border-radius: 8px;
      background: #fff;
      font: 600 12px system-ui, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
      color: #1b2a44;
      cursor: pointer;
    }
    /* 名前はボタン（押すとその柱に寄る）。見た目は文字のまま */
    .rank-table__pick {
      padding: 0;
      border: none;
      background: none;
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }
    .rank-table__pick:hover .rank-table__then {
      text-decoration: underline;
    }
    /* 一覧で選んだ行と、その柱のラベル（柱には紺の輪郭。constants.ts の SELECT_OUTLINE_COLOR） */
    .rank-table__row--selected th,
    .rank-table__row--selected td {
      background: #e6ecf7;
    }
    .rank-table__row--selected .rank-table__then {
      font-weight: 700;
    }
    .pillar-label--selected > span {
      outline: 2px solid #1b2a44;
      background: #fff;
    }
    .rank-panel__body {
      overflow-y: auto;
      padding: 6px 14px 14px;
      font-size: 13px;
    }
    .rank-table {
      width: 100%;
      border-collapse: collapse;
    }
    .rank-table__caption {
      text-align: left;
      font-size: 12px;
      color: #6b7686;
      padding: 4px 0 6px;
    }
    .rank-table th,
    .rank-table td {
      padding: 4px 6px;
      border-bottom: 1px solid #eef1f6;
      text-align: left;
      vertical-align: baseline;
    }
    .rank-table thead th {
      font-size: 11px;
      font-weight: 600;
      color: #6b7686;
      white-space: nowrap;
    }
    .rank-table__rank {
      width: 3em;
      text-align: right !important;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .rank-table__pop {
      text-align: right !important;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .rank-table__now {
      font-size: 11px;
      color: #6b7686;
    }
    .rank-table__change {
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .rank-table__move--up {
      color: #1b6b3a;
    }
    .rank-table__move--down {
      color: #8a3b12;
    }
    .rank-table__move--same {
      color: #6b7686;
    }
    .rank-table__new {
      font-weight: 700;
    }
    /* 印の色は柱と同じ（constants.ts の CHANGE_IN_PILLAR_COLOR・CHANGE_OUT_PILLAR_COLOR・CHANGE_OUT_OPACITY） */
    .rank-mark {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      margin-right: 5px;
      vertical-align: -1px;
    }
    .rank-mark--in {
      background: #f08a00;
    }
    .rank-mark--out {
      background: rgba(194, 48, 122, 0.55);
    }
    .rank-panel__sub {
      margin: 16px 0 4px;
      font-size: 14px;
    }
    .rank-panel__note {
      margin-top: 12px;
      font-size: 11px;
      color: #4a5568;
    }
    .rank-panel__note p {
      margin: 4px 0;
    }
    /* 画面が狭いとき（スマホ・小さなノートPC）は、年表・下のパネルと重ならないよう、地図の上に全面で重ねる（2026-11-23 yyamaが案1を選んだ） */
    @media (max-width: 1199px) {
      .rank-panel {
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        width: auto;
        border-radius: 0;
        padding-top: 52px;
      }
    }

    /* スタート画面（src/intro.ts）。地図をうすく暗くした上に重ねる。教室のプロジェクターでも読めるよう本文は 17px */
    .intro {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.45);
      font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
      color: #1b2a44;
    }
    .intro[hidden] {
      display: none;
    }
    .intro__card {
      max-width: 680px;
      max-height: 100%;
      overflow-y: auto;
      padding: 32px 36px 24px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      font-size: 17px;
      line-height: 1.7;
    }
    .intro__title {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.3;
    }
    .intro__title-part {
      display: inline-block;
    }
    .intro__title:focus {
      outline: none;
    }
    .intro__lead {
      margin: 0 0 16px;
    }
    .intro__how {
      margin: 0 0 16px;
      padding-left: 1.2em;
    }
    .intro__how li {
      margin: 6px 0;
    }
    .intro__note {
      margin: 0 0 20px;
      padding: 10px 14px;
      border-radius: 8px;
      background: #f1f4f9;
      font-size: 15px;
    }
    .intro__actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 20px;
    }
    .intro__start {
      padding: 12px 32px;
      border: none;
      border-radius: 10px;
      background: #2f6fd6;
      color: #fff;
      font: 700 18px system-ui, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
      cursor: pointer;
    }
    .intro__start:disabled {
      background: #9aa8bd;
      cursor: wait;
    }
    .intro__hide {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: #4a5568;
    }
    .intro__credit {
      margin: 20px 0 0;
      font-size: 11px;
      line-height: 1.5;
      color: #6b7686;
    }
    .intro__credit a,
    .intro__note a {
      color: inherit;
    }
    .intro__start:focus-visible,
    .intro a:focus-visible,
    .intro input:focus-visible,
    .intro-help:focus-visible {
      outline: 3px solid #1b2a44;
      outline-offset: 2px;
    }
    /* 右上の「？」：スタート画面を開き直す（「一覧」の左） */
    .intro-help {
      position: absolute;
      top: 16px;
      right: 96px;
      z-index: 6;
      width: 38px;
      height: 38px;
      border: 1px solid #c9d3e3;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      font: 700 17px system-ui, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
      color: #1b2a44;
      cursor: pointer;
    }
    @media (max-width: 719px) {
      .intro {
        padding: 0;
      }
      .intro__card {
        max-width: none;
        height: 100%;
        border-radius: 0;
        padding: 20px;
        font-size: 15px;
      }
      .intro__title {
        font-size: 22px;
      }
    }

    /* 仮データを使っている年に出す印 */
    .dummy-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      background: #d64545;
      color: #fff;
      font: 700 14px system-ui, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    }
  </style>
</head>

<body style="margin: 0; overflow: hidden">
  <!-- touch-action: none：タッチ画面でのピンチでページが拡大されないようにする（地図の操作は Navara が受け取る） -->
  <div id="main" style="position: relative; width: 100vw; height: 100vh; touch-action: none"></div>
</body>

</html>
